schema: 1
name: fiotransfer
description: Upload files to anonymous file-sharing services and print compact share codes.
homepage: https://github.com/BogdanStamenovic/fiotransfer
tags: [files, upload, sharing, cli]
install:
  platforms:
  - linux
  - darwin
  - windows
commands:
  fiotransfer:
    linux: ./ownbox.sh fiotransfer
    darwin: ./ownbox.sh fiotransfer
    windows: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fiotransfer.ps1 fiotransfer'
  fioget:
    linux: ./ownbox.sh fioget
    darwin: ./ownbox.sh fioget
    windows: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fiotransfer.ps1 fioget'
